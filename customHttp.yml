customHeaders:
  - pattern: '**/*'
    headers:
      - key: 'Content-Security-Policy'
        value: "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https://api.tokenfactory.nebius.com https://api.tavily.com; font-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
      - key: 'Strict-Transport-Security'
        value: 'max-age=31536000; includeSubDomains'
      - key: 'X-Content-Type-Options'
        value: 'nosniff'
      - key: 'X-Frame-Options'
        value: 'DENY'
      - key: 'Referrer-Policy'
        value: 'no-referrer'
      - key: 'Permissions-Policy'
        value: 'camera=(), microphone=(), geolocation=()'
      - key: 'Cross-Origin-Opener-Policy'
        value: 'same-origin'
      - key: 'X-Robots-Tag'
        value: 'noindex, nofollow'
  - pattern: 'config.js'
    headers:
      - key: 'Cache-Control'
        value: 'no-store'
